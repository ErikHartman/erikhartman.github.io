<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="ai-futures-title ai-futures-description">
  <title id="ai-futures-title">Five imagined futures for artificial intelligence</title>
  <desc id="ai-futures-description">Three possible paths lead to the five scenarios discussed in this essay. Superintelligence branches into loss of human control or abundance. Gradual improvement branches into tools for oppression or tools for progress. Stalled progress leads to a new AI winter. This is a conceptual map of the author's scenarios, not an exhaustive list or a prediction of their likelihood.</desc>
  <defs>
    <marker id="ai-futures-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M221 88H260 M260 51V125"/>
    <path d="M221 238H260 M260 201V275"/>
    <g marker-end="url(#ai-futures-arrow)">
      <path d="M260 51H305"/>
      <path d="M260 125H305"/>
      <path d="M260 201H305"/>
      <path d="M260 275H305"/>
      <path d="M221 366H305"/>
    </g>
  </g>
  <g fill="#fff" stroke="#222" stroke-width="1.5">
    <circle cx="329" cy="51" r="15"/>
    <circle cx="329" cy="125" r="15"/>
    <circle cx="329" cy="201" r="15"/>
    <circle cx="329" cy="275" r="15"/>
    <circle cx="329" cy="366" r="15"/>
  </g>
  <g fill="#000" font-family="Arial, sans-serif" font-size="18">
    <text x="20" y="94">Superintelligence</text>
    <text x="20" y="244">Gradual improvement</text>
    <text x="20" y="372">Progress stalls</text>
    <text x="358" y="57">Loss of human control</text>
    <text x="358" y="131">Abundance</text>
    <text x="358" y="207">Tools for oppression</text>
    <text x="358" y="281">Tools for progress</text>
    <text x="358" y="372">A new AI winter</text>
    <g text-anchor="middle">
      <text x="329" y="57">1</text>
      <text x="329" y="131">2</text>
      <text x="329" y="207">3</text>
      <text x="329" y="281">4</text>
      <text x="329" y="372">5</text>
    </g>
  </g>
</svg>
