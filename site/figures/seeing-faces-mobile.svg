<svg xmlns="http://www.w3.org/2000/svg" width="340" height="445" viewBox="0 0 340 445" role="img" aria-labelledby="faces-mobile-title faces-mobile-description">
  <title id="faces-mobile-title">Seeing a face in a rock</title>
  <desc id="faces-mobile-description">Two small hollows and a curved crack in a rock resemble the eyes and mouth of a face. A downward arrow connects the rock to a simple drawing of the face we recognize.</desc>
  <defs>
    <marker id="faces-mobile-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(12 -10)">
      <path d="M92 146 78 111 88 68 119 40 172 31 217 55 235 96 224 132 193 153 142 162Z"/>
      <path d="M88 68 108 77 103 104 M193 153 190 137 210 126 M172 31 166 49" stroke="#777"/>
      <ellipse cx="137" cy="83" rx="7" ry="5" transform="rotate(-18 137 83)"/>
      <ellipse cx="181" cy="83" rx="7" ry="5" transform="rotate(13 181 83)"/>
      <path d="M128 110 140 118 159 123 177 119 187 109"/>
    </g>
    <circle cx="170" cy="330" r="63"/>
    <circle cx="148" cy="317" r="5"/>
    <circle cx="192" cy="317" r="5"/>
    <path d="M141 344Q170 370 199 344"/>
    <path d="M170 208V244" stroke="#555" marker-end="url(#faces-mobile-arrow)"/>
  </g>
  <g fill="#000" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="170" y="186">Marks on a rock</text>
    <text x="170" y="426">A familiar face</text>
  </g>
</svg>
