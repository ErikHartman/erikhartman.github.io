<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img" aria-labelledby="disease-title disease-description">
  <title id="disease-title">Molecular measurements and disease trajectories</title>
  <desc id="disease-description">A host cell and a matrix of molecular measurements lead into branching paths through time. Blue dots represent observed states, with one possible trajectory highlighted in coral.</desc>
  <g stroke="#42515c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <!-- A host cell connects the molecular measurements to their biological origin. -->
    <path d="M39 81C59 62 86 72 95 92C108 105 103 130 87 143C74 160 51 158 34 143C15 133 15 111 23 99C26 91 31 86 39 81Z" fill="#edf4f7"/>
    <path d="M37 111C40 97 57 92 66 102C75 111 69 125 59 129C46 135 34 125 37 111Z" fill="#b9d0dc"/>
    <path d="M41 89Q46 84 52 88M27 123Q28 130 35 131M73 84Q80 85 82 92M72 140Q78 140 81 134" fill="none" stroke="#95aebf"/>
    <circle cx="52" cy="112" r="4" fill="#95aebf"/>
    <circle cx="32" cy="104" r="2.5" fill="#b8c9b5" stroke="none"/>
    <circle cx="49" cy="144" r="2.5" fill="#b8c9b5" stroke="none"/>

    <!-- A compact heatmap uses color, rather than invented numerical measurements. -->
