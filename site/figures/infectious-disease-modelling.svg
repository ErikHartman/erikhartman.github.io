      <rect x="72" y="20" width="13" height="14" rx="2" fill="#b9d0dc"/>
      <rect x="0" y="40" width="13" height="14" rx="2" fill="#b8c9b5"/>
      <rect x="18" y="40" width="13" height="14" rx="2" fill="#edf4f7"/>
