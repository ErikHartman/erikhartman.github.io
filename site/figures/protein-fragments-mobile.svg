  <title id="fragments-mobile-title">Proteins break down into smaller peptides</title>
  <desc id="fragments-mobile-description">From top to bottom: a folded protein chain breaks into three shorter peptide fragments. One fragment is linked to a bacterial cell, showing that some peptides help fight bacteria. The other fragments are not linked to the bacterium. This is a conceptual illustration, not a molecular structure.</desc>
