<svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240" role="img" aria-labelledby="fragments-title fragments-description">
  <title id="fragments-title">Proteins break down into smaller peptides</title>
  <desc id="fragments-description">A folded protein chain breaks into three shorter peptide fragments. One fragment is linked to a bacterial cell, showing that some peptides help fight bacteria. The other fragments are not linked to the bacterium. This is a conceptual illustration, not a molecular structure.</desc>
