    <circle cx="309" cy="66" r="3.5"/><circle cx="330" cy="66" r="3.5"/><circle cx="351" cy="66" r="3.5"/>
    <circle cx="267" cy="164" r="3.5"/><circle cx="284.5" cy="164" r="3.5"/>
