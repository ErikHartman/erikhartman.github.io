<svg xmlns="http://www.w3.org/2000/svg" width="440" height="200" viewBox="0 0 440 200" role="img" aria-labelledby="degradation-graph-title degradation-graph-desc">
  <title id="degradation-graph-title">A peptide degradation cascade</title>
  <desc id="degradation-graph-desc">A long peptide separates into two fragments, which each divide into shorter fragments through sequential cleavage. The number of beads is conserved at each division. This is a schematic, not measured data.</desc>
  <defs>
    <marker id="degradation-graph-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L5 3 L1 5" fill="none" stroke="#777" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <circle id="degradation-graph-bead" cx="0" cy="0" r="3.5" fill="#fff" stroke="#222" stroke-width="1.1"/>
  </defs>
  <g fill="#222" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">
    <text x="220" y="24">Sequential cleavage</text>
    <text x="220" y="190">Peptide fragments</text>
  </g>
  <g fill="none" stroke="#888" stroke-width="1.1" marker-end="url(#degradation-graph-arrow)">
    <path d="M186 59 L126 89"/>
    <path d="M264 59 L318 89"/>
    <path d="M112 111 L78 141"/>
    <path d="M149 111 L188 141"/>
    <path d="M309 111 L281 141"/>
    <path d="M330 111 L366 141"/>
  </g>
  <g fill="none" stroke="#888" stroke-width="1.1">
    <path d="M154 48 H286 M84 100 H168 M300 100 H336 M54 152 H102 M176 152 H200 M274 152 H286 M360 152 H372"/>
  </g>
