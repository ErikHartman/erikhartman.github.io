<svg xmlns="http://www.w3.org/2000/svg" width="640" height="265" viewBox="0 0 640 265" role="img" aria-labelledby="improvement-title improvement-description">
  <title id="improvement-title">A hypothetical self-improvement loop</title>
  <desc id="improvement-description">An AI system proposes changes to itself. Those changes are built and tested. If they work, the improved system repeats the process. The return arrow illustrates recursive self-improvement as a hypothetical loop, not a prediction of future capabilities or speed.</desc>
  <defs>
    <marker id="improvement-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 1.5 7 4.5 2 7.5" fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="20" y="47" width="176" height="86" rx="3"/>
    <rect x="232" y="47" width="176" height="86" rx="3"/>
    <rect x="444" y="47" width="176" height="86" rx="3"/>
  </g>
  <g fill="none" stroke="#555" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#improvement-arrow)">
    <path d="M202 90H224"/>
    <path d="M414 90H436"/>
    <path d="M532 147V187Q532 194 525 194H115Q108 194 108 187V147"/>
  </g>
  <g fill="#000" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">
    <text x="108" y="84">AI proposes</text>
    <text x="108" y="110">changes</text>
    <text x="320" y="84">Changes are</text>
    <text x="320" y="110">built and tested</text>
    <text x="532" y="84">A more</text>
    <text x="532" y="110">capable system</text>
    <text x="532" y="27">If they work</text>
    <text x="320" y="236">The improved system repeats the process</text>
  </g>
</svg>
